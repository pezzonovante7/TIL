<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIL • Today I Learned</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
        
        :root {
            --her-orange: #FF6B35;
            --her-warm: #E85D04;
            --her-dark: #121212;
            --her-card: #1F1F1F;
            --her-text: #F5F0E6;
            --her-muted: #B8B0A0;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading-serif {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .her-bg {
            background-color: #121212;
        }

        .her-card {
            background-color: #1F1F1F;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                       box-shadow 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        
        .her-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 
                       0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .her-accent {
            color: #FF6B35;
        }

        .section-header {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
            color: #B8B0A0;
        }

        .til-entry {
            border-left: 3px solid #FF6B35;
        }

        .date-badge {
            background-color: #2A2A2A;
            color: #FF6B35;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }

        .entry-title {
            color: #F5F0E6;
            font-weight: 600;
            line-height: 1.3;
        }

        .entry-description {
            color: #D1C9B8;
            line-height: 1.7;
        }

        .nav-scrolled {
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
        }

        .empty-state {
            border: 1px dashed #3A3A3A;
        }

        .learning-count {
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body class="her-bg text-[#F5F0E6] min-h-screen">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-white/10 transition-all duration-300" id="navbar">
        <div class="max-w-4xl mx-auto px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-x-3">
                    <div class="flex items-center gap-x-2">
                        <div class="w-8 h-8 rounded-full bg-[#FF6B35] flex items-center justify-center">
                            <i class="fa-solid fa-lightbulb text-white text-lg"></i>
                        </div>
                        <div>
                            <span class="text-2xl font-semibold tracking-tight">TIL</span>
                        </div>
                    </div>
                    <div class="hidden sm:block">
                        <span class="text-sm text-[#B8B0A0]">Today I Learned</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-4">
                    <div class="flex items-center gap-x-2 text-sm">
                        <div class="w-2 h-2 bg-[#FF6B35] rounded-full animate-pulse"></div>
                        <span class="text-[#B8B0A0]" id="entry-count">Loading...</span>
                    </div>
                    
                    <a href="https://github.com/pezzonovante7/TIL" 
                       target="_blank"
                       class="flex items-center gap-x-2 px-4 py-2 text-sm rounded-full border border-white/10 hover:bg-white/5 transition-colors">
                        <i class="fa-brands fa-github"></i>
                        <span class="hidden sm:inline">View on GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="max-w-4xl mx-auto px-6 pt-12 pb-8">
        <div class="max-w-2xl">
            <div class="flex items-center gap-x-3 mb-3">
                <div class="px-4 py-1.5 rounded-full bg-[#FF6B35]/10 text-[#FF6B35] text-xs font-medium tracking-[1px]">
                    PERSONAL JOURNAL
                </div>
            </div>
            
            <h1 class="text-6xl md:text-7xl leading-none tracking-tighter heading-serif mb-4">
                Today I Learned
            </h1>
            <p class="text-xl text-[#B8B0A0] max-w-md">
                A living archive of daily discoveries, insights, and quiet moments of understanding.
            </p>
        </div>
    </div>

    <!-- Search -->
    <div class="max-w-4xl mx-auto px-6 pb-8">
        <div class="relative max-w-md">
            <input 
                type="text" 
                id="search-input"
                placeholder="Search your learnings..." 
                class="w-full bg-[#1F1F1F] border border-white/10 focus:border-[#FF6B35]/50 transition-colors rounded-2xl pl-12 pr-5 py-3.5 text-sm placeholder:text-[#B8B0A0] focus:outline-none"
            >
            <i class="fa-solid fa-search absolute left-5 top-4 text-[#B8B0A0]"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="max-w-4xl mx-auto px-6 pb-20">
        <div id="content">
            <!-- Populated by JavaScript -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden max-w-md mx-auto text-center py-12">
            <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-[#1F1F1F] flex items-center justify-center">
                <i class="fa-solid fa-book text-3xl text-[#FF6B35]"></i>
            </div>
            <h3 class="text-xl font-medium mb-2">No entries yet</h3>
            <p class="text-[#B8B0A0]">Start logging what you learn each day. Your first entry will appear here.</p>
        </div>
    </div>

    <footer class="border-t border-white/10 py-8">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <p class="text-xs text-[#B8B0A0]">
                Built with intention • <span class="font-mono">pezzonovante7/TIL</span>
            </p>
        </div>
    </footer>

    <script>
        // Tailwind script
        function initializeTailwind() {
            document.documentElement.style.setProperty('--accent', '#FF6B35');
        }

        // Navbar scroll effect
        function initNavbar() {
            const navbar = document.getElementById('navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 20) {
                    navbar.classList.add('nav-scrolled', 'shadow-lg');
                } else {
                    navbar.classList.remove('nav-scrolled', 'shadow-lg');
                }
            });
        }

        // Format date nicely
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Group entries by date
        function groupByDate(entries) {
            const groups = {};
            
            entries.forEach(entry => {
                if (!groups[entry.date]) {
                    groups[entry.date] = [];
                }
                groups[entry.date].push(entry);
            });
            
            // Sort dates descending
            return Object.keys(groups)
                .sort((a, b) => new Date(b) - new Date(a))
                .map(date => ({
                    date,
                    entries: groups[date]
                }));
        }

        // Render all entries
        function renderEntries(entries) {
            const contentDiv = document.getElementById('content');
            const emptyState = document.getElementById('empty-state');
            
            contentDiv.innerHTML = '';
            
            if (!entries || entries.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('entry-count').textContent = '0 entries';
                return;
            }
            
            emptyState.classList.add('hidden');
            document.getElementById('entry-count').textContent = `${entries.length} entries`;
            
            const grouped = groupByDate(entries);
            
            grouped.forEach(group => {
                const dateSection = document.createElement('div');
                dateSection.className = 'mb-10';
                
                // Date header
                const dateHeader = document.createElement('div');
                dateHeader.className = 'flex items-center gap-x-4 mb-4 sticky top-[65px] bg-[#121212] py-3 z-40 border-b border-white/10';
                dateHeader.innerHTML = `
                    <div class="date-badge flex items-center gap-x-2">
                        <i class="fa-regular fa-calendar text-xs"></i>
                        <span>${formatDate(group.date)}</span>
                    </div>
                    <div class="flex-1 h-px bg-white/10"></div>
                    <div class="text-xs text-[#B8B0A0] font-mono">${group.entries.length} ${group.entries.length === 1 ? 'entry' : 'entries'}</div>
                `;
                
                dateSection.appendChild(dateHeader);
                
                // Entries for this date
                group.entries.forEach(entry => {
                    const entryEl = document.createElement('div');
                    entryEl.className = `her-card til-entry mb-4 rounded-3xl p-7 border border-white/5`;
                    
                    entryEl.innerHTML = `
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1 min-w-0">
                                <h3 class="entry-title text-2xl leading-tight mb-4">${entry.title}</h3>
                                
                                <div class="entry-description prose prose-invert max-w-none text-[15px]">
                                    ${entry.description.replace(/\n/g, '<br>')}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    dateSection.appendChild(entryEl);
                });
                
                contentDiv.appendChild(dateSection);
            });
        }

        // Fetch logs.json
        async function loadTILData() {
            const contentDiv = document.getElementById('content');
            
            try {
                const response = await fetch('logs.json');
                
                if (!response.ok) {
                    throw new Error('Failed to load logs.json');
                }
                
                const data = await response.json();
                
                // Sort entries by date descending then by title
                const sortedData = [...data].sort((a, b) => {
                    if (a.date === b.date) {
                        return a.title.localeCompare(b.title);
                    }
                    return new Date(b.date) - new Date(a.date);
                });
                
                renderEntries(sortedData);
                
                // Setup search
                setupSearch(sortedData);
                
            } catch (error) {
                console.error('Error loading TIL data:', error);
                contentDiv.innerHTML = `
                    <div class="max-w-md mx-auto text-center py-12 px-6">
                        <div class="text-[#FF6B35] mb-4">
                            <i class="fa-solid fa-exclamation-triangle text-4xl"></i>
                        </div>
                        <h3 class="text-xl font-medium mb-2">Unable to load entries</h3>
                        <p class="text-[#B8B0A0] text-sm">
                            Please ensure <code class="font-mono bg-black/30 px-1.5 py-0.5 rounded">logs.json</code> 
                            exists in the repository and GitHub Pages is enabled.
                        </p>
                    </div>
                `;
            }
        }

        // Simple client-side search
        function setupSearch(allEntries) {
            const searchInput = document.getElementById('search-input');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                
                if (!query) {
                    renderEntries(allEntries);
                    return;
                }
                
                const filtered = allEntries.filter(entry => 
                    entry.title.toLowerCase().includes(query) || 
                    entry.description.toLowerCase().includes(query)
                );
                
                renderEntries(filtered);
            });
            
            // Allow ESC to clear search
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    renderEntries(allEntries);
                }
            });
        }

        // Initialize everything
        function init() {
            initializeTailwind();
            initNavbar();
            loadTILData();
            
            // Keyboard shortcut hint
            console.log('%c[TIL] Press "/" to focus search', 'color:#666');
            
            // Optional: Focus search with "/"
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            });
        }

        // Boot application
        window.onload = init;
    </script>
</body>
</html>
