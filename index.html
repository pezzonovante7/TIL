<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIL • Today I Learned</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap');

        body {
            font-family: 'Outfit', system_ui, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .heading-serif {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Light Theme (Default - Warm) */
        :root {
            --bg: #F8F4ED;
            --card-bg: #FFFFFF;
            --accent: #E85D04;
            --accent-light: #FF8C61;
            --text-primary: #2C2522;
            --text-secondary: #6B625B;
            --border: #EDE6D9;
            --date-badge-bg: #F0E9DC;
            --date-badge-text: #E85D04;
            --nav-bg: rgba(248, 244, 237, 0.75);
        }

        /* Dark Theme (Warm Dark) */
        .dark {
            --bg: #1F1A17;
            --card-bg: #2A2420;
            --accent: #FF6B35;
            --accent-light: #FF8C61;
            --text-primary: #F5F0E6;
            --text-secondary: #B8B0A0;
            --border: #3D3631;
            --date-badge-bg: #3D3631;
            --date-badge-text: #FF8C61;
            --nav-bg: rgba(31, 26, 23, 0.75);
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
        }

        #navbar {
            background-color: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .her-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.3s ease;
        }
        
        .her-card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 20px 30px -10px color-mix(in srgb, var(--accent) 12%, transparent);
            border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
        }

        .til-entry {
            border-left: 4px solid var(--accent);
        }

        .date-badge {
            background-color: var(--date-badge-bg);
            color: var(--date-badge-text);
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            transition: transform 0.2s ease;
        }

        .date-badge:hover {
            transform: scale(1.05);
        }

        .entry-title {
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.3;
        }

        .entry-description {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .theme-toggle {
            transition: all 0.2s ease;
        }

        .theme-toggle:hover i {
            transform: rotate(20deg);
        }

        .theme-toggle i {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #search-input {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #search-input:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
            transform: scale(1.01);
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 9999px;
            border: 3px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .section-header {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full opacity-[0.06] dark:opacity-[0.03] pointer-events-none blur-[120px] transition-colors duration-500" style="background: radial-gradient(circle, var(--accent) 0%, transparent 70%); z-index: -10;"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full opacity-[0.05] dark:opacity-[0.02] pointer-events-none blur-[120px] transition-colors duration-500" style="background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%); z-index: -10;"></div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-[var(--border)] transition-all duration-300" id="navbar">
        <div class="max-w-4xl mx-auto px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-x-3">
                    <div class="flex items-center gap-x-2">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: var(--accent);">
                            <i class="fa-solid fa-lightbulb text-white text-lg"></i>
                        </div>
                        <div>
                            <span class="text-2xl font-semibold tracking-tight">TIL</span>
                        </div>
                    </div>
                    <div class="hidden sm:block">
                        <span class="text-sm" style="color: var(--text-secondary);">Today I Learned</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-3">
                    <!-- Theme Toggle -->
                    <button onclick="toggleTheme()" 
                            class="theme-toggle flex items-center justify-center w-10 h-10 rounded-full border border-[var(--border)] hover:bg-[var(--card-bg)] transition-colors"
                            title="Toggle theme">
                        <i class="fa-solid fa-moon text-lg" id="theme-icon"></i>
                    </button>

                    <div class="flex items-center gap-x-2 text-sm">
                        <div class="w-2 h-2 rounded-full animate-pulse" style="background-color: var(--accent);"></div>
                        <span style="color: var(--text-secondary);" id="entry-count">Loading...</span>
                    </div>
                    
                    <a href="https://github.com/pezzonovante7/TIL" 
                       target="_blank"
                       class="flex items-center gap-x-2 px-4 py-2 text-sm rounded-full border border-[var(--border)] hover:bg-[var(--card-bg)] transition-colors">
                        <i class="fa-brands fa-github"></i>
                        <span class="hidden sm:inline">GitHub</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="max-w-4xl mx-auto px-6 pt-12 pb-8">
        <div class="max-w-2xl">
            <div class="flex items-center gap-x-3 mb-3">
                <div class="px-4 py-1.5 rounded-full text-xs font-medium tracking-[1px]" 
                     style="background-color: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent);">
                    PERSONAL JOURNAL
                </div>
            </div>
            
            <h1 class="text-6xl md:text-7xl leading-none tracking-tighter heading-serif mb-4">
                Today I Learned
            </h1>
            <p class="text-xl max-w-md" style="color: var(--text-secondary);">
                A living archive of daily discoveries, insights, and quiet moments of understanding.
            </p>
        </div>
    </div>

    <!-- Search -->
    <div class="max-w-4xl mx-auto px-6 pb-8">
        <div class="relative max-w-md">
            <input 
                type="text" 
                id="search-input"
                placeholder="Search your learnings..." 
                class="w-full border focus:outline-none transition-colors rounded-2xl pl-12 pr-5 py-3.5 text-sm"
                style="background-color: var(--card-bg); border-color: var(--border); color: var(--text-primary);"
            >
            <i class="fa-solid fa-search absolute left-5 top-4" style="color: var(--text-secondary);"></i>
        </div>
    </div>

    <!-- Content -->
    <div class="max-w-4xl mx-auto px-6 pb-20">
        <div id="content">
            <!-- Populated by JavaScript -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden max-w-md mx-auto text-center py-12">
            <div class="w-16 h-16 mx-auto mb-6 rounded-full flex items-center justify-center" style="background-color: var(--card-bg);">
                <i class="fa-solid fa-book text-3xl" style="color: var(--accent);">
            </i>
            <h3 class="text-xl font-medium mb-2">No entries yet</h3>
            <p style="color: var(--text-secondary);">Start logging what you learn each day.</p>
        </div>
    </div>

    <footer class="border-t py-8" style="border-color: var(--border);">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <p class="text-xs" style="color: var(--text-secondary);">
                Built with intention • <span class="font-mono">pezzonovante7/TIL</span>
            </p>
        </div>
    </footer>

    <script>
        // Theme Management
        function setTheme(theme) {
            const root = document.documentElement;
            const icon = document.getElementById('theme-icon');
            
            if (theme === 'dark') {
                root.classList.add('dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
                localStorage.setItem('til-theme', 'dark');
            } else {
                root.classList.remove('dark');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
                localStorage.setItem('til-theme', 'light');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('til-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme) {
                setTheme(savedTheme);
            } else if (prefersDark) {
                setTheme('dark');
            } else {
                setTheme('light'); // Default to light (warm)
            }
        }

        function linkify(text) {
            const urlRegex = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
            return text.replace(urlRegex, (url) => `<a href="${url}" target="_blank" class="text-[var(--accent)] hover:underline">${url}</a>`);
        }

        function renderDescription(desc) {
            const html = desc.replace(/\n/g, '<br>');
            const withCode = html.replace(/`([^`]+)`/g, '<code class="bg-[var(--date-badge-bg)] text-[var(--accent)] px-2 py-0.5 rounded text-sm font-mono font-medium">$1</code>');
            return linkify(withCode);
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Group entries by date
        function groupByDate(entries) {
            const groups = {};
            entries.forEach(entry => {
                if (!groups[entry.date]) groups[entry.date] = [];
                groups[entry.date].push(entry);
            });
            return Object.keys(groups)
                .sort((a, b) => new Date(b) - new Date(a))
                .map(date => ({ date, entries: groups[date] }));
        }

        // Render entries
        function renderEntries(entries) {
            const contentDiv = document.getElementById('content');
            const emptyState = document.getElementById('empty-state');
            contentDiv.innerHTML = '';
            
            if (!entries || entries.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('entry-count').textContent = '0 entries';
                return;
            }
            
            emptyState.classList.add('hidden');
            document.getElementById('entry-count').textContent = `${entries.length} entries`;
            
            const grouped = groupByDate(entries);
            let entryCount = 0;
            
            grouped.forEach(group => {
                const dateSection = document.createElement('div');
                dateSection.className = 'mb-10';
                
                const dateHeader = document.createElement('div');
                dateHeader.className = 'flex items-center gap-x-4 mb-4 sticky top-[65px] py-3 z-40 border-b';
                dateHeader.style.borderColor = 'var(--border)';
                dateHeader.style.backgroundColor = 'var(--bg)';
                dateHeader.innerHTML = `
                    <div class="date-badge flex items-center gap-x-2">
                        <i class="fa-regular fa-calendar text-xs"></i>
                        <span>${formatDate(group.date)}</span>
                    </div>
                    <div class="flex-1 h-px" style="background-color: var(--border);"></div>
                    <div class="text-xs font-mono" style="color: var(--text-secondary);">
                        ${group.entries.length} ${group.entries.length === 1 ? 'entry' : 'entries'}
                    </div>
                `;
                
                dateSection.appendChild(dateHeader);
                
                group.entries.forEach(entry => {
                    const entryEl = document.createElement('div');
                    entryEl.className = `her-card til-entry mb-4 rounded-3xl p-7 animate-fade-in-up`;
                    entryEl.style.animationDelay = `${entryCount * 70}ms`;
                    entryCount++;
                    
                    entryEl.innerHTML = `
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1 min-w-0">
                                <h3 class="entry-title text-2xl leading-tight mb-4">${entry.title}</h3>
                                
                                <div class="entry-description text-[15px]">
                                    ${renderDescription(entry.description)}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    dateSection.appendChild(entryEl);
                });
                
                contentDiv.appendChild(dateSection);
            });
        }

        // Load data
        async function loadTILData() {
            try {
                const response = await fetch('logs.json');
                if (!response.ok) throw new Error('Failed to load');
                
                const data = await response.json();
                const sortedData = [...data].sort((a, b) => {
                    if (a.date === b.date) return a.title.localeCompare(b.title);
                    return new Date(b.date) - new Date(a.date);
                });
                
                renderEntries(sortedData);
                setupSearch(sortedData);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="max-w-md mx-auto text-center py-12 px-6">
                        <i class="fa-solid fa-exclamation-triangle text-4xl mb-4" style="color: var(--accent);">
                        </i>
                        <h3 class="text-xl font-medium mb-2">Unable to load entries</h3>
                        <p style="color: var(--text-secondary);">Please check if GitHub Pages is enabled.</p>
                    </div>
                `;
            }
        }

        function setupSearch(allEntries) {
            const searchInput = document.getElementById('search-input');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    renderEntries(allEntries);
                    return;
                }
                const filtered = allEntries.filter(entry => 
                    entry.title.toLowerCase().includes(query) || 
                    entry.description.toLowerCase().includes(query)
                );
                renderEntries(filtered);
            });
            
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    renderEntries(allEntries);
                }
            });
        }

        function init() {
            initTheme();
            loadTILData();
            
            // Keyboard shortcut for search
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName === 'BODY') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
